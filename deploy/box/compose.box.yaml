# The bots' sandbox for a self-hosted server: layered over compose.yaml with
# COMPOSE_FILE=compose.yaml:compose.box.yaml, after prepare-host.sh has loaded
# the two host profiles it names.
#
# Docker's default seccomp profile refuses unshare(CLONE_NEWUSER) and its
# docker-default AppArmor profile refuses mount, so bubblewrap cannot build a
# box under them; omb-home-narrow and seccomp-omb-home allow exactly what it
# needs. systempaths=unconfined lifts Docker's masks over /proc, which would
# stop bubblewrap mounting a fresh one; the AppArmor profile denies what those
# masks hid. No capability is added and the container is never privileged.
services:
  omb:
    environment:
      OMB_BOT_BOX: "1"
    security_opt:
      - apparmor=omb-home-narrow
      - seccomp=/etc/mausbot/seccomp-omb-home.json
      - no-new-privileges=true
      - systempaths=unconfined
